name: build
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main is what the live endpoint pulls (:latest); other branches only get their own tags, for testing first
      - id: tags
        run: |
          R=ghcr.io/${{ github.repository }}
          if [ "${{ github.ref_name }}" = main ]; then echo "t=$R:latest,$R:${{ github.sha }}" >> $GITHUB_OUTPUT
          else echo "t=$R:${{ github.ref_name }},$R:${{ github.sha }}" >> $GITHUB_OUTPUT; fi
      # zstd layers unpack several times faster than gzip on the worker (containerd >= 1.5, Docker >= 23); the registry
      # build cache keeps unchanged layers byte-identical between builds, so workers re-pull only what changed
      - uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          tags: ${{ steps.tags.outputs.t }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=registry,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - run: df -h /
